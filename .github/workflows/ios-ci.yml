name: FORJA iOS CI

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios-ci.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forja-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Core tests and iOS build
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test core
        run: swift test --package-path ios

      - name: Validate bundled content and game rules
        working-directory: ios
        run: swift run forja-core-checks

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project ios/ForjaIOS.xcodeproj \
            -scheme FORJA \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/forja-derived-data" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build Release without signing
        run: |
          xcodebuild \
            -project ios/ForjaIOS.xcodeproj \
            -scheme FORJA \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/forja-release-derived-data" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify Release excludes visual QA hooks
        run: |
          APP_BINARY="$RUNNER_TEMP/forja-release-derived-data/Build/Products/Release-iphonesimulator/FORJA.app/FORJA"
          test -x "$APP_BINARY"
          if strings "$APP_BINARY" | grep -Eq 'forja-ui-demo|forja-onboarding-step|forja-tab|forja-workout-demo'; then
            echo "A DEBUG-only visual QA hook leaked into the Release binary."
            exit 1
          fi

      - name: Launch on iPhone simulators
        run: |
          ios/scripts/ci_simulator_smoke.sh \
            "$RUNNER_TEMP/forja-derived-data" \
            "$RUNNER_TEMP/forja-screenshots"

      - name: Upload simulator screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forja-simulator-screenshots
          path: ${{ runner.temp }}/forja-screenshots
          if-no-files-found: warn
          retention-days: 7
